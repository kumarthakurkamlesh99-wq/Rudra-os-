name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Diagnostic - Inspect workspace & Gradle structure
        run: |
          echo "=== Workspace Root Listing ==="
          ls -la
          echo "=== Gradle Wrapper Listing ==="
          ls -la gradle/wrapper/ 2>/dev/null || ls -la gradle/ 2>/dev/null || echo "No gradle directory found"
          echo "=== Environment Details ==="
          pwd
          whoami

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle Wrapper..."
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin || true
          fi
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Ensure Environment Configuration
        run: |
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            echo "Copying .env.example to .env..."
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Check and Decode Release Keystore
        id: setup_signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "All release signing secrets are provided. Decoding keystore..."
            echo "$SIGNING_KEY" | base64 --decode > "${{ github.workspace }}/release.keystore"
            echo "SIGNING_CONFIGURED=true" >> $GITHUB_ENV
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
          else
            echo "Release signing secrets not fully provided. Building unsigned release APK..."
            echo "SIGNING_CONFIGURED=false" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          else
            gradle assembleDebug --stacktrace --no-daemon
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -x "./gradlew" ]; then
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: Prepare APK Artifacts
        run: |
          mkdir -p artifacts
          
          # Locate and copy Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK at $DEBUG_APK"
            cp "$DEBUG_APK" artifacts/app-debug.apk
          else
            echo "::warning::Debug APK not found in default output directory"
          fi

          # Locate and copy Release APK (signed or unsigned)
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK at $RELEASE_APK"
            cp "$RELEASE_APK" artifacts/app-release.apk
          else
            echo "::warning::Release APK not found in default output directory"
          fi

          ls -lah artifacts/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: artifacts/app-release.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload All APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
