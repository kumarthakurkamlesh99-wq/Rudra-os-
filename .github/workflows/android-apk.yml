name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Prepare Gradle Wrapper & Permissions
        run: |
          echo "Setting up Gradle wrapper binaries..."
          gradle wrapper --gradle-version 9.3.1 --distribution-type bin || true
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: Prepare Environment and Google Services Configurations
        run: |
          # 1. Create .env from .env.example or fallback
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              cp .env.example .env
            else
              touch .env
            fi
          fi
          echo "GEMINI_API_KEY=dummy_placeholder_key" >> .env
          echo "Created .env successfully"

          # 2. Ensure fallback google-services.json exists
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating fallback app/google-services.json for Google Services plugin..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.rudralifeos.bxzkpm"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyApiKeyPlaceholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Build Debug APK
        run: |
          echo "Building Debug APK with Gradle Wrapper..."
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect Debug APK Artifact
        run: |
          mkdir -p artifacts
          DEBUG_APK=$(find app/build/outputs/apk -type f -name "*debug*.apk" -o -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found APK at: $DEBUG_APK"
            cp "$DEBUG_APK" artifacts/app-debug.apk
            echo "Artifacts directory contents:"
            ls -lh artifacts/
          else
            echo "Error: No APK file was generated in app/build/outputs/apk/"
            find app/build/outputs/ -type f || true
            exit 1
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error
          retention-days: 30
