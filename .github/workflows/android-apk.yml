name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: false

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Generating Gradle Wrapper binaries..."
            gradle wrapper --gradle-version 8.11.1 --distribution-type bin || true
          fi
          chmod +x gradlew

      - name: Prepare Environment and Google Services Configurations
        run: |
          # 1. Ensure .env exists
          if [ ! -f ".env" ]; then
            if [ -f ".env.example" ]; then
              echo "Creating .env from .env.example"
              cp .env.example .env
            else
              echo "Creating fallback .env"
              echo "GEMINI_API_KEY=dummy_key" > .env
            fi
          fi

          # 2. Ensure fallback google-services.json exists if none provided
          if [ ! -f "app/google-services.json" ]; then
            echo "Generating placeholder app/google-services.json for build compatibility..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "1234567890",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:1234567890:android:abcdef",
                  "android_client_info": {
                    "package_name": "com.aistudio.rudralifeos.bxzkpm"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyApiKeyPlaceholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Setup Signing Configuration
        id: setup_signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ] && [ -n "$STORE_PASSWORD" ]; then
            echo "Signing secrets detected. Decoding release keystore..."
            echo "$SIGNING_KEY" | base64 --decode > "${{ github.workspace }}/release.keystore"
            echo "KEYSTORE_PATH=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
            echo "SIGNING_CONFIGURED=true" >> $GITHUB_ENV
          else
            echo "Signing secrets not present or incomplete. Release build will use fallback signing."
            echo "SIGNING_CONFIGURED=false" >> $GITHUB_ENV
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-configuration-cache --stacktrace --no-daemon

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-configuration-cache --stacktrace --no-daemon

      - name: Collect APK Artifacts
        run: |
          mkdir -p artifacts
          
          # Debug APK
          DEBUG_APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
            echo "Found Debug APK: $DEBUG_APK"
            cp "$DEBUG_APK" artifacts/app-debug.apk
          else
            echo "::error::Debug APK was not generated!"
            exit 1
          fi

          # Release APK
          RELEASE_APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            echo "Found Release APK: $RELEASE_APK"
            cp "$RELEASE_APK" artifacts/app-release.apk
          else
            echo "::error::Release APK was not generated!"
            exit 1
          fi

          echo "Generated Artifacts:"
          ls -lh artifacts/

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: artifacts/app-release.apk
          if-no-files-found: error
          retention-days: 30
